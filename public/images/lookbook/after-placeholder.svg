<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Platzhalter "Nachher" – hochglanzverdichtete Felge -->
  <defs>
    <radialGradient id="bg2" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1f1f25"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="chrome2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#eef0f4"/>
      <stop offset="50%" stop-color="#a6abb6"/>
      <stop offset="56%" stop-color="#5c616c"/>
      <stop offset="82%" stop-color="#d7dae1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <g transform="translate(400,300)">
    <circle r="220" fill="#0c0c0f" stroke="#33333a" stroke-width="18"/>
    <circle r="185" fill="none" stroke="url(#chrome2)" stroke-width="12"/>
    <g stroke="url(#chrome2)" stroke-width="28" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-170"/>
      <line x1="0" y1="0" x2="162" y2="-53"/>
      <line x1="0" y1="0" x2="100" y2="138"/>
      <line x1="0" y1="0" x2="-100" y2="138"/>
      <line x1="0" y1="0" x2="-162" y2="-53"/>
    </g>
    <circle r="54" fill="url(#chrome2)"/>
    <circle r="30" fill="#0a0a0c"/>
    <circle r="30" fill="none" stroke="#e11d2a" stroke-width="4"/>
    <!-- Glanzpunkte -->
    <circle cx="-70" cy="-90" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="90" cy="70" r="6" fill="#ffffff" opacity="0.7"/>
  </g>
  <text x="400" y="560" fill="#8f95a1" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" letter-spacing="4">NACHHER (PLATZHALTER)</text>
</svg>
