<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Platzhalter "Vorher" – matte/beschädigte Felge -->
  <rect width="800" height="600" fill="#0e0e11"/>
  <g transform="translate(400,300)">
    <circle r="220" fill="#111114" stroke="#2a2a30" stroke-width="18"/>
    <circle r="185" fill="none" stroke="#5b5f66" stroke-width="10"/>
    <g stroke="#6b6f77" stroke-width="26" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="0" x2="0" y2="-170"/>
      <line x1="0" y1="0" x2="162" y2="-53"/>
      <line x1="0" y1="0" x2="100" y2="138"/>
      <line x1="0" y1="0" x2="-100" y2="138"/>
      <line x1="0" y1="0" x2="-162" y2="-53"/>
    </g>
    <circle r="52" fill="#4d525c"/>
    <circle r="30" fill="#17171b"/>
    <!-- Kratzer / Bordsteinschäden -->
    <path d="M120 -150 L170 -120" stroke="#3a3a42" stroke-width="6" stroke-linecap="round"/>
    <path d="M-150 90 L-120 140" stroke="#3a3a42" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="0" y="0" width="800" height="600" fill="#000" opacity="0.18"/>
  <text x="400" y="560" fill="#5c616c" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" letter-spacing="4">VORHER (PLATZHALTER)</text>
</svg>
