<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c7ccd4"/>
      <stop offset="55%" stop-color="#7d828c"/>
      <stop offset="100%" stop-color="#eef0f3"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef0f3"/>
      <stop offset="50%" stop-color="#868b95"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <g transform="translate(32,32)">
    <!-- Reifen -->
    <circle r="27" fill="#050506" stroke="#1b1c20" stroke-width="3"/>
    <!-- Chromring -->
    <circle r="24" fill="none" stroke="url(#ring)" stroke-width="3.5"/>
    <!-- Felgenbett -->
    <circle r="20.5" fill="#0d0d10"/>
    <!-- Speichen (10) -->
    <g stroke="url(#chrome)" stroke-width="4.6" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-19"/>
      <line x1="0" y1="0" x2="11.2" y2="-15.4"/>
      <line x1="0" y1="0" x2="18.1" y2="-5.9"/>
      <line x1="0" y1="0" x2="18.1" y2="5.9"/>
      <line x1="0" y1="0" x2="11.2" y2="15.4"/>
      <line x1="0" y1="0" x2="0" y2="19"/>
      <line x1="0" y1="0" x2="-11.2" y2="15.4"/>
      <line x1="0" y1="0" x2="-18.1" y2="5.9"/>
      <line x1="0" y1="0" x2="-18.1" y2="-5.9"/>
      <line x1="0" y1="0" x2="-11.2" y2="-15.4"/>
    </g>
    <!-- Nabe -->
    <circle r="6.5" fill="#16171b" stroke="url(#ring)" stroke-width="2.4"/>
    <circle r="2.4" fill="#e11d2a"/>
  </g>
</svg>
