<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <!-- ============================================================= -->
  <!-- PLATZHALTER Hero-Felge (rim-beleuchtetes Chrom auf Schwarz).   -->
  <!-- Ersetze diese Datei durch dein echtes Foto:                    -->
  <!--   public/images/wheels/chromwerk-hero.jpg                      -->
  <!-- und passe site.heroImage (src/data/site.ts) auf .jpg an.       -->
  <!-- ============================================================= -->
  <defs>
    <radialGradient id="bg" cx="58%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#161821"/>
      <stop offset="55%" stop-color="#07070a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#dfe6f2"/>
      <stop offset="44%" stop-color="#8b93a3"/>
      <stop offset="52%" stop-color="#3f4552"/>
      <stop offset="70%" stop-color="#aeb7c6"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8cfdb"/>
      <stop offset="50%" stop-color="#4b515e"/>
      <stop offset="100%" stop-color="#e9edf4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- Wheel, leicht in 3/4 gedreht (Ellipse) -->
  <g transform="translate(820,512) rotate(-8) scale(1,0.9)">
    <!-- Barrel / Tiefe -->
    <ellipse cx="60" cy="0" rx="430" ry="430" fill="#0a0b0e"/>
    <ellipse cx="30" cy="0" rx="420" ry="420" fill="url(#barrel)" opacity="0.55"/>
    <!-- Reifen-/Außenkante mit Rim-Light -->
    <circle r="452" fill="none" stroke="#05060a" stroke-width="46"/>
    <circle r="430" fill="none" stroke="url(#chrome)" stroke-width="20" filter="url(#glow)"/>

    <!-- 10 schlanke Doppelspeichen -->
    <g stroke="url(#chrome)" stroke-linecap="round" filter="url(#glow)">
      <g stroke-width="30">
        <line x1="0" y1="0" x2="0" y2="-405"/>
        <line x1="0" y1="0" x2="238" y2="-328"/>
        <line x1="0" y1="0" x2="385" y2="-125"/>
        <line x1="0" y1="0" x2="385" y2="125"/>
        <line x1="0" y1="0" x2="238" y2="328"/>
        <line x1="0" y1="0" x2="0" y2="405"/>
        <line x1="0" y1="0" x2="-238" y2="328"/>
        <line x1="0" y1="0" x2="-385" y2="125"/>
        <line x1="0" y1="0" x2="-385" y2="-125"/>
        <line x1="0" y1="0" x2="-238" y2="-328"/>
      </g>
    </g>

    <!-- Nabe + Center-Cap -->
    <circle r="96" fill="url(#chrome)" filter="url(#glow)"/>
    <circle r="54" fill="#08090c"/>
    <circle r="54" fill="none" stroke="#d81322" stroke-width="6"/>
    <circle r="20" fill="url(#chrome)"/>

    <!-- Glanz-Sterne (Highlights) -->
    <g fill="#ffffff" filter="url(#glow)">
      <circle cx="-300" cy="-260" r="9"/>
      <circle cx="330" cy="180" r="7"/>
      <circle cx="120" cy="-360" r="6"/>
    </g>
  </g>

  <!-- Bodenreflex -->
  <ellipse cx="860" cy="960" rx="470" ry="34" fill="#11131a" opacity="0.7"/>
</svg>
