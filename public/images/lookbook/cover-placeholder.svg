<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Platzhalter-Cover: einzelne Chromfelge auf Schwarz, ohne Text.
       Wird durch echte Felgenfotos ersetzt (coverImage in src/data/lookbook.ts). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="46%" stop-color="#aeb4bd"/>
      <stop offset="54%" stop-color="#565b64"/>
      <stop offset="100%" stop-color="#e9ebee"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7dbe0"/>
      <stop offset="50%" stop-color="#6c717a"/>
      <stop offset="100%" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400,400)">
    <!-- Reifen/Außenring -->
    <circle r="300" fill="none" stroke="#0b0b0d" stroke-width="34"/>
    <circle r="278" fill="none" stroke="url(#rim)" stroke-width="10"/>
    <!-- Felgenbett -->
    <circle r="250" fill="#0c0c0f" stroke="#26262c" stroke-width="6"/>
    <!-- Speichen -->
    <g stroke="url(#spoke)" stroke-width="30" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-232"/>
      <line x1="0" y1="0" x2="136" y2="-188"/>
      <line x1="0" y1="0" x2="220" y2="-72"/>
      <line x1="0" y1="0" x2="220" y2="72"/>
      <line x1="0" y1="0" x2="136" y2="188"/>
      <line x1="0" y1="0" x2="0" y2="232"/>
      <line x1="0" y1="0" x2="-136" y2="188"/>
      <line x1="0" y1="0" x2="-220" y2="72"/>
      <line x1="0" y1="0" x2="-220" y2="-72"/>
      <line x1="0" y1="0" x2="-136" y2="-188"/>
    </g>
    <!-- Nabe / Center-Cap -->
    <circle r="58" fill="#111114" stroke="url(#rim)" stroke-width="8"/>
    <circle r="16" fill="#0a0a0c" stroke="#e11d2a" stroke-width="4"/>
  </g>
</svg>
