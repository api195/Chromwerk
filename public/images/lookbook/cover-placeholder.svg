<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Platzhalter Cover – Split Vorher/Nachher -->
  <defs>
    <linearGradient id="chrome3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9aa0ab"/>
      <stop offset="56%" stop-color="#5c616c"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="#0e0e11"/>
  <rect x="400" width="400" height="600" fill="#141419"/>
  <g transform="translate(400,300)">
    <!-- linke (matte) Hälfte -->
    <clipPath id="left"><rect x="-260" y="-260" width="260" height="520"/></clipPath>
    <clipPath id="right"><rect x="0" y="-260" width="260" height="520"/></clipPath>
    <g clip-path="url(#left)">
      <circle r="200" fill="#111114" stroke="#2a2a30" stroke-width="16"/>
      <g stroke="#6b6f77" stroke-width="24" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-155"/>
        <line x1="0" y1="0" x2="147" y2="-48"/>
        <line x1="0" y1="0" x2="91" y2="125"/>
        <line x1="0" y1="0" x2="-91" y2="125"/>
        <line x1="0" y1="0" x2="-147" y2="-48"/>
      </g>
    </g>
    <g clip-path="url(#right)">
      <circle r="200" fill="#0c0c0f" stroke="#33333a" stroke-width="16"/>
      <g stroke="url(#chrome3)" stroke-width="26" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-155"/>
        <line x1="0" y1="0" x2="147" y2="-48"/>
        <line x1="0" y1="0" x2="91" y2="125"/>
        <line x1="0" y1="0" x2="-91" y2="125"/>
        <line x1="0" y1="0" x2="-147" y2="-48"/>
      </g>
    </g>
    <circle r="48" fill="url(#chrome3)"/>
    <circle r="26" fill="#0a0a0c"/>
    <circle r="26" fill="none" stroke="#e11d2a" stroke-width="3"/>
  </g>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#e11d2a" stroke-width="2" opacity="0.6"/>
  <text x="200" y="70" fill="#5c616c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" letter-spacing="3">VORHER</text>
  <text x="600" y="70" fill="#a6abb6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" letter-spacing="3">NACHHER</text>
</svg>
