<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Platzhalter Pflegeprodukt – ersetze durch echtes Produktfoto -->
  <defs>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="45%" stop-color="#16161b"/>
      <stop offset="55%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a6abb6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#0a0a0c"/>
  <g transform="translate(300,300)">
    <rect x="-70" y="-150" width="140" height="330" rx="26" fill="url(#bottle)" stroke="#3a3a42" stroke-width="2"/>
    <rect x="-40" y="-210" width="80" height="70" rx="10" fill="#1d1d23" stroke="#3a3a42" stroke-width="2"/>
    <rect x="-58" y="-60" width="116" height="150" rx="8" fill="url(#label)" opacity="0.92"/>
    <rect x="-58" y="-14" width="116" height="6" fill="#e11d2a"/>
    <text x="0" y="-30" fill="#0a0a0c" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">CHROMWERK</text>
    <text x="0" y="40" fill="#4d525c" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="3">PFLEGE</text>
  </g>
  <text x="300" y="560" fill="#4d525c" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" letter-spacing="3">PRODUKT (PLATZHALTER)</text>
</svg>
